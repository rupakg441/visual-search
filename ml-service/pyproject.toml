[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-search-ml"
version = "0.1.0"
description = "FastAPI ML embedding and preprocessing service for jewelry visual search"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pillow>=10.4.0",
  "numpy>=1.26.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "open-clip-torch>=2.26.0",
  "transformers>=4.44.0",
  "onnxruntime>=1.18.0",
  "rembg>=2.0.59",
  "ultralytics>=8.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
